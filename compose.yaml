services:
  app:
    build: .
    mem_limit: 256m
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      OLLAMA_CPUS: ${OLLAMA_CPUS:-0}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-300}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-768}
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.40.16
    mem_limit: 5g
    cpus: ${OLLAMA_CPUS:-0}
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
    volumes:
      - ollama-models:/root/.ollama
    entrypoint:
      - /bin/sh
      - -ec
      - |
        ollama serve &
        pid=$$!
        trap 'kill "$$pid"; wait "$$pid" || true; exit 0' INT TERM
        until ollama list >/dev/null 2>&1; do
          kill -0 "$$pid"
          sleep 1
        done
        if ! ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1; then
          ollama pull "$$OLLAMA_MODEL"
        fi
        wait "$$pid"
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$OLLAMA_MODEL\" >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 15m
      retries: 3

volumes:
  ollama-models:
