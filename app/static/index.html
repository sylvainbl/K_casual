<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gene Expression Explorer</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>

<body>
  <main>
    <header>
      <h1>Gene Expression Explorer</h1>
      <p>Find genes associated with a cancer and explore their recorded median expression.</p>
    </header>

    <form id="question-form">
      <div class="form-heading">
        <label for="question">Ask a question</label>
        <button id="advanced-toggle" type="button" aria-pressed="false" aria-controls="advanced-warning">
          Advanced mode
        </button>
      </div>
      <p id="advanced-warning" hidden>
        <strong>Experimental.</strong> Explore comparisons and calculations across cancers.
        The model may misinterpret your question. Check the SQL behind the result.
      </p>
      <div class="composer">
        <input id="question" name="question" required maxlength="1500"
          placeholder="Which genes are associated with lung cancer?">
        <button type="submit">Ask</button>
      </div>
      <div class="examples simple-examples" aria-label="Example questions">
        <button type="button" data-question="How can you help me?">How can you help me?</button>
        <button type="button" data-question="What are the main genes involved in lung cancer?">Lung cancer
          genes</button>
        <button type="button"
          data-question="What is the median value expression of genes involved in breast cancer?">Breast cancer
          expression</button>
        <button type="button"
          data-question="What is the median value expression of genes involved in esophageal cancer?">Esophageal cancer
          expression</button>
      </div>
      <div class="examples advanced-examples" aria-label="Advanced example questions">
        <button type="button"
          data-question="Which genes are recorded in both breast and prostate cancers?">Breast
          and prostate overlap</button>
        <button type="button"
          data-question="Which genes appear in at least three cancers, and in how many cancers does each appear?">Genes
          in at least 3 cancers</button>
        <button type="button"
          data-question="What is the difference in recorded median expression of BRCA2 between prostate and breast cancer?">BRCA2
          difference by cancer</button>
        <button type="button"
          data-question="For each cancer, what percentage of its recorded genes have a median expression strictly above 0.5?">Percent
          above 0.5 by cancer</button>
      </div>
    </form>

    <p id="status" role="status"></p>
    <div id="loading" hidden>
      processing... (<span id="elapsed"></span>)
    </div>
    <section id="result" aria-label="Answer" hidden></section>
  </main>
</body>

</html>
